name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile skills/pc2android/scripts/pc2android.py skills/pc2android/scripts/godot_backend.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test skills/pc2android/scripts/virtual-keys.test.js
      - run: python skills/pc2android/scripts/pc2android.py --help
      - name: Smoke-test CrySirror detection
        run: |
          mkdir -p /tmp/cry-game
          touch /tmp/cry-game/data.xp3
          python3 skills/pc2android/scripts/pc2android.py \
            --source /tmp/cry-game \
            --name Smoke \
            --application-id com.example.smoke \
            --out /tmp/cry-out \
            --engine auto \
            --dry-run
      - name: Smoke-test Godot detection
        run: |
          mkdir -p /tmp/godot-game
          python3 - <<'PY'
          import struct
          from pathlib import Path
          Path('/tmp/godot-game/game.pck').write_bytes(struct.pack('<4sIIII', b'GDPC', 2, 4, 7, 2) + b'\0' * 80)
          PY
          python3 skills/pc2android/scripts/pc2android.py \
            --source /tmp/godot-game \
            --name Smoke \
            --application-id com.example.smoke \
            --out /tmp/godot-out \
            --engine auto \
            --dry-run
      - name: Validate Agent Skills metadata
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('skills/pc2android/SKILL.md').read_text()
          assert text.startswith('---\n'), 'missing frontmatter'
          end = text.index('\n---\n', 3)
          frontmatter = text[4:end]
          keys = [line.split(':', 1)[0] for line in frontmatter.splitlines() if line and not line.startswith(' ')]
          allowed = {'name', 'description', 'license', 'metadata', 'compatibility', 'allowed-tools'}
          assert set(keys) <= allowed, f'unexpected frontmatter keys: {keys}'
          name = re.search(r'^name: (.+)$', frontmatter, re.M).group(1).strip()
          description = re.search(r'^description: (.+)$', frontmatter, re.M).group(1).strip()
          assert re.fullmatch(r'[a-z0-9-]+', name), name
          assert len(name) <= 64, len(name)
          assert len(description) <= 1024, len(description)
          assert '\n' not in description, 'description must be single-line'
          assert re.search(r'^license: MIT$', frontmatter, re.M), 'license must be MIT'
          assert len(text.splitlines()) < 500, len(text.splitlines())
          assert 'TODO:' not in text, 'unresolved TODO'
          assert 'qoder' not in text.lower(), 'skill must stay agent-agnostic'
          print('skill ok:', name, len(description), 'chars')
          PY
